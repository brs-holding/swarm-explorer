<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="swarm-mark-title">
  <title id="swarm-mark-title">SWARM hex-bee mark</title>
  <defs>
    <clipPath id="swarm-body-clip">
      <path d="M32 15.5 L45.856 23.5 L45.856 39.5 L32 47.5 L18.144 39.5 L18.144 23.5 Z"/>
    </clipPath>
  </defs>
  <!-- stinger: a downward triangle at the bottom vertex, behind the body -->
  <path d="M28.8 44 L35.2 44 L32 51.3 Z" fill="#E8890C"/>
  <!-- wings: two smaller pointy-top hexagons, tilted outward, behind the body -->
  <g fill="#FFC94D" opacity="0.92">
    <path d="M16.6 12.8 L24.221 17.2 L24.221 26 L16.6 30.4 L8.979 26 L8.979 17.2 Z" transform="rotate(-20 16.6 21.6)"/>
    <path d="M47.4 12.8 L55.021 17.2 L55.021 26 L47.4 30.4 L39.779 26 L39.779 17.2 Z" transform="rotate(20 47.4 21.6)"/>
  </g>
  <!-- body: one pointy-top regular hexagon -->
  <path d="M32 15.5 L45.856 23.5 L45.856 39.5 L32 47.5 L18.144 39.5 L18.144 23.5 Z" fill="#F5A623"/>
  <!-- stripes: two bands clipped to the body, leaving three honey bands -->
  <g clip-path="url(#swarm-body-clip)" fill="#0E1116">
    <rect x="16" y="21.5" width="32" height="4.4"/>
    <rect x="16" y="34.1" width="32" height="4.4"/>
  </g>
</svg>
